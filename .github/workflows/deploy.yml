name: Sync Sheet & Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            sync:
                description: Sync Google Sheet before build
                type: boolean
                default: true

permissions:
    contents: write
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        if: github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v6
              with:
                  version: 11.5.0

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Sync Google Sheet
              if: github.event_name == 'workflow_dispatch' && inputs.sync
              env:
                  GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
                  GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
                  GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
              run: pnpm sync

            - name: Commit updated data.json
              if: github.event_name == 'workflow_dispatch' && inputs.sync
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add public/data.json
                  if git diff --staged --quiet; then
                      echo "No data.json changes"
                  else
                      git commit -m "chore: sync album data from Google Sheet [skip ci]"
                      git push
                  fi

            - name: Build
              run: pnpm build

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: dist

    deploy:
        if: github.actor != 'github-actions[bot]'
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
